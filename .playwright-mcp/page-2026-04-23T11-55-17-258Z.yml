        - heading "Things you might be wondering:" [level=2] [ref=e376]
        - generic [ref=e377]:
          - generic [ref=e378]:
            - button "How accurate is 23andMe?" [ref=e379] [cursor=pointer]
            - region:
              - paragraph [ref=e380]: "23andMe has rigorous standards that ensure high-quality results. Our team of scientists and medical experts use a robust process to develop genetic reports for our customers. Here are specific examples:"
              - list [ref=e381]:
                - listitem [ref=e382]: With one of the largest reference datasets in the world, 23andMe provides customers with one of the most detailed and accurate ancestry breakdowns on the market. Our algorithms make ancestry estimates based on probabilities and they’re generally very accurate, but your results are not set in stone. We are always trying to improve and refine these estimates.
          - generic [ref=e383]:
            - button "How does 23andMe DNA testing work?" [ref=e384] [cursor=pointer]
            - region:
              - paragraph [ref=e385]: After you provide a saliva sample, 23andMe uses genotyping to analyze your DNA. This means we look at specific locations in your genome that are known to differ between people. We then turn those results into personalized genetic reports on everything from ancestry composition to traits to genetic health risks. Note that genotyping is different from DNA sequencing, which looks at every letter in a particular stretch of DNA.
          - generic [ref=e386]:
            - button "Who can use 23andMe?" [ref=e387] [cursor=pointer]
            - region:
              - paragraph [ref=e388]:
                - text: Most adults who are able to provide saliva samples can use the 23andMe kit. However there are some considerations that can complicate the DNA accuracy. Check out our
                - link "Terms of Service" [ref=e389] [cursor=pointer]:
                  - /url: /legal/terms-of-service/
                - text: for more info on those cases.
          - generic [ref=e390]:
            - button "How do I get my 23andMe reports and how long does it take?" [ref=e391] [cursor=pointer]
            - region:
              - paragraph [ref=e392]:
                - text: To begin, visit
                - link "www.23andme.com/start" [ref=e393] [cursor=pointer]:
                  - /url: /start/
                - text: . Once you have successfully registered your DNA testing kit, provided a saliva sample and put the kit in the mail, you can use the return tracking link available on your profile homepage to track your kit's progress to the lab. Once your sample reaches the lab, it is typically processed within a few weeks, with results then delivered to your secure online account.
          - generic [ref=e394]:
            - button "Do 23andMe DNA test kits expire?" [ref=e395] [cursor=pointer]
            - region:
              - paragraph [ref=e396]: We encourage customers to provide their sample before the "Collect saliva by" date on the side of the collection tube. If your sample collection kit is lost or damaged, or if it has expired, please contact customer care to assist you with getting a replacement kit.
          - generic [ref=e397]:
            - button "Why should I buy 23andMe?" [ref=e398] [cursor=pointer]
            - region:
              - paragraph [ref=e399]: When it comes to understanding your DNA, 23andMe offers trusted insights built on years of scientific research and innovation. As a pioneer in personal genetic testing, we've helped millions of people worldwide learn more about their ancestry, their health—and themselves.
              - paragraph [ref=e400]: We offer more than just ancestry breakdowns. Our genetic health services screen for up to 95+ conditions, helping you understand your personal health risks and predispositions. You can also gain insights into carrier status for family planning, wellness and lifestyle factors, and how your body processes certain medications—empowering proactive, informed health decisions. We're the first and only direct-to-consumer DNA service with multiple health reports with FDA clearance, setting the standard in genetic testing.
              - paragraph [ref=e401]: With one of the world's largest DNA databases, we provide an unmatched level of detail, accuracy, and discovery in our ancestry product. Our ancestry reports include 4,500+ geographic regions and the option to connect with DNA relatives, making it the most comprehensive ancestry product on the market.
              - paragraph [ref=e402]: And if you decide to participate in our research program, you'll join millions of others helping advance discoveries in genetics and human health. It's a simple but meaningful way to make an impact in areas like Parkinson's disease, cancer, depression, and more. It's a unique opportunity to contribute to scientific progress, simply by participating from home.
              - paragraph [ref=e403]: Protecting your privacy and keeping your data secure are top priorities at 23andMe. We're committed to being transparent and giving you clear choices about how your information is used.
              - paragraph [ref=e404]: So why choose 23andMe? Because it's more than a test. It's a trusted path to self-discovery, backed by science, and built for you.
          - generic [ref=e405]:
            - button "Why do at-home genetic testing?" [ref=e406] [cursor=pointer]
            - region:
              - paragraph [ref=e407]: Your DNA holds powerful information about your health, ancestry, and traits—and at-home genetic testing puts that knowledge in your hands.
              - paragraph [ref=e408]: Most people who carry a serious, highly actionable genetic variant don't even know it. In fact, about 90% go undetected through standard doctor visits alone. An at-home genetic test like 23andMe can uncover important health insights that might otherwise remain hidden, giving you the opportunity to take proactive steps, ask better questions, and make more informed decisions.
              - paragraph [ref=e409]: Unlike traditional medical testing, at-home genetic testing is simple, accessible, and done entirely from home. You don't need a referral or a clinic appointment to start learning about your genetic makeup. And with 23andMe premium subscription services, you're not just getting a one-time snapshot, you're gaining ongoing access to new science-backed reports on everything from inherited health conditions to traits and ancestry.
              - paragraph [ref=e410]: Personal genetic testing is about empowerment. It's about understanding your risks, discovering your roots, and gaining clarity about how your genes may impact your life, as well as your family's.
              - paragraph [ref=e411]: When you can access this kind of information directly, you're in a better position to advocate for your health, your choices, and your future.
